<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE PYQ — Previous Year Question Papers</title>
<meta name="description" content="Find Electronics & Communication Engineering previous year question papers by semester, subject and year.">
<meta name="theme-color" content="#070a12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070a12'/%3E%3Crect x='30' y='30' width='40' height='40' rx='6' fill='none' stroke='%2334e2e2' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%2334e2e2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070a12;
  --surface:rgba(255,255,255,.04);
  --surface-strong:rgba(255,255,255,.07);
  --border:rgba(148,210,255,.14);
  --border-strong:rgba(148,210,255,.36);
  --text:#e8edf7;
  --text-dim:#93a1ba;
  --text-faint:#5b6780;
  --accent:#34e2e2;
  --accent-rgb:52,226,226;
  --accent2:#9b7bff;
  --accent-soft:rgba(52,226,226,.14);
  --accent2-soft:rgba(155,123,255,.16);
  --navbar-bg:rgba(7,10,18,.72);
  --card-tint-1:rgba(255,255,255,.045);
  --card-tint-2:rgba(255,255,255,.015);
  --card-shadow-hover:0 14px 40px rgba(0,0,0,.5);
  --viewer-bg:#0c1120;
  --radius-lg:20px;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
/* Light mode palette — activated by [data-theme="light"] on <html>, set by #themeToggle in the script below. */
:root[data-theme="light"]{
  --bg:#f4f7fb;
  --surface:rgba(15,23,42,.035);
  --surface-strong:rgba(15,23,42,.06);
  --border:rgba(30,41,59,.14);
  --border-strong:rgba(30,41,59,.32);
  --text:#10182a;
  --text-dim:#4a5570;
  --text-faint:#7c869c;
  --accent:#0891a0;
  --accent-rgb:8,145,160;
  --accent2:#7048d8;
  --accent-soft:rgba(8,145,160,.12);
  --accent2-soft:rgba(112,72,216,.14);
  --navbar-bg:rgba(244,247,251,.72);
  --card-tint-1:rgba(15,23,42,.035);
  --card-tint-2:rgba(15,23,42,.012);
  --card-shadow-hover:0 10px 28px rgba(15,23,42,.14);
  --viewer-bg:#e7ecf5;
}
:root[data-theme="light"] .glow-blob{opacity:.16;}
:root[data-theme="light"] .circuit-item{opacity:calc(var(--ci-op,.16) * 1.35);}
:root[data-theme="light"] .trace-flow-path{opacity:.22;}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background-color .35s ease,color .35s ease;}
a{color:inherit;}
button{font:inherit;}
h1,h2,h3,p{margin:0;}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;}

/* atmosphere */
.bg-fixed{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);}
.bg-fixed > svg{width:100%;height:100%;opacity:.07;display:block;}
.glow-blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;}
.glow-blob.c1{width:520px;height:520px;background:var(--accent);top:-160px;left:-120px;}
.glow-blob.c2{width:480px;height:480px;background:var(--accent2);bottom:-180px;right:-140px;}

/* floating circuit graphics — ambient only, pointer-events:none is inherited from .bg-fixed */
.circuit-scene{position:absolute;inset:0;}
.circuit-item{position:absolute;width:var(--ci-size,44px);height:auto;opacity:var(--ci-op,.16);animation-timing-function:ease-in-out;animation-iteration-count:infinite;will-change:transform;}
.ci-1{top:9vh;left:5vw;--ci-size:56px;color:var(--accent);--ci-op:.16;animation-name:driftA;animation-duration:26s;animation-delay:-4s;}
.ci-2{top:23vh;left:3vw;--ci-size:38px;color:var(--text-faint);--ci-op:.22;animation-name:driftB;animation-duration:33s;animation-delay:-12s;}
.ci-3{top:41vh;left:6vw;--ci-size:44px;color:var(--text-faint);--ci-op:.2;animation-name:tumbleSlow;animation-duration:46s;animation-delay:-9s;}
.ci-4{top:59vh;left:4vw;--ci-size:44px;color:var(--accent2);--ci-op:.16;animation-name:driftC;animation-duration:29s;animation-delay:-17s;}
.ci-5{top:75vh;left:8vw;--ci-size:50px;color:var(--text-faint);--ci-op:.2;animation-name:driftA;animation-duration:37s;animation-delay:-6s;}
.ci-6{top:13vh;right:6vw;--ci-size:40px;color:var(--accent);--ci-op:.18;animation-name:driftB;animation-duration:31s;animation-delay:-14s;}
.ci-7{top:31vh;right:4vw;--ci-size:42px;color:var(--text-faint);--ci-op:.2;animation-name:tumbleSlow;animation-duration:52s;animation-delay:-21s;}
.ci-8{top:49vh;right:7vw;--ci-size:36px;color:var(--text-faint);--ci-op:.22;animation-name:driftC;animation-duration:34s;animation-delay:-8s;}
.ci-9{top:66vh;right:5vw;--ci-size:34px;color:var(--text-faint);--ci-op:.2;animation-name:driftA;animation-duration:28s;animation-delay:-19s;}
.ci-10{top:85vh;right:9vw;--ci-size:32px;color:var(--accent2);--ci-op:.18;animation-name:driftB;animation-duration:39s;animation-delay:-3s;}
.ci-11{top:90vh;left:14vw;--ci-size:32px;color:var(--text-faint);--ci-op:.18;animation-name:driftC;animation-duration:32s;animation-delay:-25s;}
.ci-12{top:5vh;right:22vw;--ci-size:28px;color:var(--accent);--ci-op:.16;animation-name:tumbleSlow;animation-duration:41s;animation-delay:-13s;}

.trace-flow-svg{position:absolute;inset:0;width:100%;height:100%;}
.trace-flow-path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;opacity:.14;stroke-dasharray:10 18;animation-name:traceFlow;animation-duration:16s;animation-timing-function:linear;animation-iteration-count:infinite;}
.trace-flow-path--alt{stroke:var(--accent2);opacity:.12;animation-duration:20s;animation-direction:reverse;}

.via-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent);animation-name:viaPulse;animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
.via-dot--alt{background:var(--accent2);box-shadow:0 0 9px var(--accent2);}
.via-1{top:20vh;left:20vw;animation-duration:5.5s;animation-delay:-1s;}
.via-2{top:66vh;right:24vw;animation-duration:6.2s;animation-delay:-3s;}
.via-3{top:82vh;left:38vw;animation-duration:4.8s;animation-delay:-2s;}
.via-4{top:12vh;right:38vw;animation-duration:7s;animation-delay:-4.5s;}

/* header: nav row + signal-trace bar */
.navbar{position:sticky;top:0;z-index:50;display:flex;flex-direction:column;background:var(--navbar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);transition:background-color .35s ease,border-color .3s ease;}
.navbar-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;letter-spacing:-.01em;flex-shrink:0;}
.nav-brand .icon-badge{width:32px;height:32px;}
.nav-brand .icon-badge svg{width:16px;height:16px;}
.accent-text{color:var(--accent);}
.breadcrumb{flex:1;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text-dim);overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
.breadcrumb::-webkit-scrollbar{display:none;}
.breadcrumb a{color:var(--text-dim);text-decoration:none;}
.breadcrumb a:hover{color:var(--accent);}
.bc-sep{opacity:.4;}
.bc-current{color:var(--text);}
.nav-search-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--accent);text-decoration:none;transition:.2s ease;flex-shrink:0;}
.nav-search-btn:hover{border-color:var(--border-strong);box-shadow:0 0 16px var(--accent-soft);}
.nav-search-btn svg{width:17px;height:17px;}

.theme-toggle{position:relative;display:inline-flex;align-items:center;flex-shrink:0;width:52px;height:28px;border-radius:999px;background:var(--surface-strong);border:1px solid var(--border);padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .2s ease;}
.theme-toggle:hover{border-color:var(--border-strong);}
.theme-toggle-icon{position:absolute;top:50%;transform:translateY(-50%);width:13px;height:13px;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);transition:color .3s ease;z-index:1;}
.theme-toggle-icon .icon{display:block;}
.theme-toggle-icon.moon{left:7px;}
.theme-toggle-icon.sun{right:7px;}
.theme-toggle-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:0 2px 10px var(--accent-soft);transition:transform .35s cubic-bezier(.4,0,.2,1);}
.theme-toggle[aria-checked="true"] .theme-toggle-thumb{transform:translateX(24px);}
.theme-toggle[aria-checked="false"] .theme-toggle-icon.moon{color:#06131a;}
.theme-toggle[aria-checked="true"] .theme-toggle-icon.sun{color:#06131a;}

.trace-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:0 20px 12px;max-width:420px;margin:0 auto;width:100%;}
.trace-seg{flex:1;height:2px;background:var(--border);transition:background .4s ease;min-width:14px;}
.trace-seg.lit{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.trace-dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex-shrink:0;transition:.4s ease;}
.trace-dot.lit{background:var(--accent);box-shadow:0 0 8px var(--accent);}
.trace-dot.current{width:10px;height:10px;box-shadow:0 0 0 4px var(--accent-soft),0 0 10px var(--accent);animation:tracePulse 1.8s ease-in-out infinite;}

/* icon badge */
.icon-badge{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;flex-shrink:0;background:var(--accent-soft);border:1px solid var(--border);color:var(--accent);}
.icon-badge svg{width:21px;height:21px;}

/* layout */
main#app{max-width:1180px;margin:0 auto;padding:0 24px 90px;position:relative;z-index:1;}
.page-enter{animation:fadeSlideUp .5s ease both;}
.page-header{padding:44px 0 26px;}
.page-header h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;letter-spacing:-.01em;}
.page-sub{color:var(--text-dim);margin-top:8px;font-size:.95rem;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-size:.85rem;margin-top:28px;transition:color .2s;}
.back-link:hover{color:var(--accent);}
.back-link svg{width:14px;height:14px;}

/* hero */
.hero{text-align:center;padding:70px 20px 56px;position:relative;}
.hero-title{font-size:clamp(2.6rem,9vw,5rem);font-weight:800;letter-spacing:-.02em;margin-bottom:14px;}
.hero-title .accent-text{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.hero-subtitle{color:var(--text-dim);font-size:clamp(.95rem,2.4vw,1.15rem);max-width:560px;margin:0 auto 22px;}
.hero-tagline{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.7rem,2.2vw,.9rem);color:var(--accent);background:var(--accent-soft);border:1px solid var(--border-strong);padding:9px 20px;border-radius:999px;margin-bottom:30px;}
.hero-tagline svg{width:14px;height:14px;}
.hero-desc{color:var(--text-dim);font-size:.92rem;margin:22px auto 0;max-width:480px;}
.spec-strip{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;color:var(--text-faint);margin-top:36px;text-transform:uppercase;}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:.95rem;border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,opacity .2s ease;}
.btn svg{width:16px;height:16px;}
.btn:hover{transform:translateY(-2px);border-color:var(--border-strong);}
.btn-primary{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#06131a;border:none;font-weight:700;box-shadow:0 10px 34px var(--accent-soft);}
.btn-primary:hover{box-shadow:0 12px 42px var(--accent-soft),0 0 30px var(--accent2-soft);transform:translateY(-3px) scale(1.02);}
.btn-lg{padding:17px 36px;font-size:1.05rem;}
.btn-ghost{background:transparent;}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none;}

/* cards & grids */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;}
.card{position:relative;isolation:isolate;background:linear-gradient(180deg,var(--card-tint-1),var(--card-tint-2));border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:12px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background-color .3s ease;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;}
.card::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;background:linear-gradient(120deg,var(--accent),transparent 45%,var(--accent2));opacity:0;filter:blur(10px);transition:opacity .3s ease;}
.card:hover{transform:translateY(-6px);border-color:var(--border-strong);box-shadow:var(--card-shadow-hover),0 0 22px var(--accent-soft);}
.card:hover::before{opacity:.45;}
.card:active{transform:translateY(-3px) scale(.99);}

.sem-card{position:relative;border-radius:14px;}
.sem-card .sem-num{font-family:var(--font-mono);font-size:2.1rem;font-weight:700;color:var(--accent);line-height:1;}
.sem-card .sem-label{font-size:1.02rem;font-weight:700;}
.sem-card .sem-sub{font-size:.78rem;color:var(--text-dim);}
.sem-card .icon-badge{position:absolute;top:20px;right:20px;opacity:.7;}

.subj-card .subj-name{font-size:1.02rem;font-weight:700;line-height:1.3;}
.subj-card .subj-code{font-family:var(--font-mono);font-size:.74rem;color:var(--text-dim);background:var(--surface-strong);display:inline-block;padding:3px 9px;border-radius:6px;width:fit-content;}
.subj-card .view-link{margin-top:auto;color:var(--accent);font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.subj-card .arrow{transition:transform .2s ease;}
.subj-card:hover .arrow{transform:translateX(4px);}

.year-card{align-items:center;text-align:center;padding:30px 20px;}
.year-card .year-num{font-family:var(--font-mono);font-size:1.7rem;font-weight:700;}
.year-status{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;}
.year-status .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
.year-status.available{color:var(--accent);}
.year-status.available .dot{background:var(--accent);box-shadow:0 0 8px var(--accent);}
.year-status.pending{color:var(--text-faint);}

.filter-input{-webkit-appearance:none;appearance:none;width:100%;max-width:340px;padding:11px 16px;margin:0 0 26px;background:var(--surface);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:.88rem;outline:none;transition:border-color .2s;}
.filter-input:focus{border-color:var(--border-strong);}
.filter-input::placeholder{color:var(--text-faint);}

/* paper viewer */
.meta-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chip-meta{font-family:var(--font-mono);font-size:.72rem;padding:5px 12px;border-radius:999px;background:var(--surface-strong);border:1px solid var(--border);color:var(--text-dim);}
.paper-actions{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap;}
.viewer-frame{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--viewer-bg);min-height:60vh;display:flex;align-items:center;justify-content:center;transition:background-color .35s ease;}
.viewer-frame iframe{width:100%;height:74vh;border:0;background:#fff;}
.empty-state{text-align:center;color:var(--text-dim);padding:70px 24px;}
.empty-state .icon-badge{margin:0 auto 18px;width:56px;height:56px;}
.empty-state .icon-badge svg{width:26px;height:26px;}
.empty-state p{margin-top:6px;}
.empty-sub{font-size:.82rem;color:var(--text-faint);max-width:340px;margin:8px auto 0;}

.notfound{text-align:center;padding:100px 20px;}
.site-footer{text-align:center;padding:32px 20px 50px;color:var(--text-faint);font-size:.78rem;position:relative;z-index:1;}

/* motion */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes tracePulse{0%,100%{box-shadow:0 0 0 4px var(--accent-soft),0 0 10px var(--accent);}50%{box-shadow:0 0 0 7px var(--accent-soft),0 0 16px var(--accent);}}
@keyframes driftA{0%,100%{transform:translate(0,0) rotate(0deg);}25%{transform:translate(14px,-20px) rotate(4deg);}50%{transform:translate(-8px,-32px) rotate(-3deg);}75%{transform:translate(-18px,-10px) rotate(2deg);}}
@keyframes driftB{0%,100%{transform:translate(0,0) rotate(0deg);}30%{transform:translate(-20px,16px) rotate(-6deg);}65%{transform:translate(12px,28px) rotate(4deg);}}
@keyframes driftC{0%,100%{transform:translate(0,0) rotate(0deg);}20%{transform:translate(22px,10px) rotate(8deg);}55%{transform:translate(4px,-24px) rotate(-5deg);}80%{transform:translate(-16px,8px) rotate(3deg);}}
@keyframes tumbleSlow{0%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(10px,-18px) rotate(180deg);}100%{transform:translate(0,0) rotate(360deg);}}
@keyframes viaPulse{0%,100%{opacity:.12;}50%{opacity:.5;}}
@keyframes traceFlow{to{stroke-dashoffset:-560;}}

/* responsive */
@media (max-width:900px){
  .card-grid.sem-grid{grid-template-columns:repeat(2,1fr);}
  .ci-6,.ci-7,.ci-8,.ci-9,.ci-10,.ci-12{display:none;}
  .circuit-item{width:calc(var(--ci-size,44px) * .82);}
}
@media (max-width:640px){
  .navbar-row{padding:12px 16px;gap:10px;}
  .breadcrumb{font-size:.72rem;}
  .card-grid{grid-template-columns:1fr !important;}
  .hero{padding:52px 18px 40px;}
  .viewer-frame iframe{height:56vh;}
  .ci-2,.ci-4,.ci-11{display:none;}
  .trace-flow-path{opacity:.09;}
  .via-dot{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}
</style>
</head>
<body>

<div class="bg-fixed" aria-hidden="true">
  <div class="glow-blob c1"></div>
  <div class="glow-blob c2"></div>
  <svg xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="circuit" width="140" height="140" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="var(--accent)" stroke-width="1">
          <path d="M0 24H52V64H140"/>
          <path d="M140 44H92V96H40V140"/>
          <path d="M22 0V32H74V0"/>
          <path d="M0 112H42V140"/>
          <path d="M110 0V20H140"/>
          <circle cx="52" cy="24" r="2.3" fill="var(--accent)" stroke="none"/>
          <circle cx="92" cy="44" r="2.3" fill="var(--accent)" stroke="none"/>
          <circle cx="40" cy="96" r="2.3" fill="var(--accent)" stroke="none"/>
          <circle cx="74" cy="32" r="2.3" fill="var(--accent)" stroke="none"/>
          <circle cx="42" cy="112" r="2.3" fill="var(--accent)" stroke="none"/>
          <circle cx="110" cy="20" r="2.3" fill="var(--accent)" stroke="none"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#circuit)"/>
  </svg>

  <div class="circuit-scene">
    <svg class="trace-flow-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <path class="trace-flow-path" d="M-50 180 C 200 60, 380 320, 640 190 S 1020 340, 1150 120"/>
      <path class="trace-flow-path trace-flow-path--alt" d="M-50 830 C 160 940, 360 700, 560 800 S 900 640, 1120 760"/>
    </svg>

function icon(key){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true">${ICONS[key] || ICONS.chip}</svg>`;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slugify(s){
  return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function pad2(n){ return String(n).padStart(2,'0'); }
function findSubjectBySlug(semId, slug){
  const subs = PYQ_DATA[semId] && PYQ_DATA[semId].subjects;
  if(!subs) return null;
  const found = Object.entries(subs).find(([name]) => slugify(name) === slug);
  return found ? { name: found[0], data: found[1] } : null;
}
function subjectCount(semId){ return Object.keys((PYQ_DATA[semId]||{}).subjects || {}).length; }
function totalSubjects(){ return Object.values(PYQ_DATA).reduce((s,sem)=>s+Object.keys(sem.subjects).length,0); }
function totalPaperSlots(){
  return Object.values(PYQ_DATA).reduce((s,sem)=>
    s + Object.values(sem.subjects).reduce((s2,sub)=>s2+Object.keys(sub.papers).length,0), 0);
}

function renderHome(){
  return `
    <section class="hero page-enter">
      <h1 class="hero-title">ECE&nbsp;<span class="accent-text">PYQ</span></h1>
      <p class="hero-subtitle">Previous Year Question Papers — Electronics &amp; Communication Engineering</p>
      <div class="hero-tagline">${icon('bolt')}<span>${esc(HERO_TAGLINE)}</span>${icon('bolt')}</div>
      <a href="#/semesters" class="btn btn-primary btn-lg">${icon('search')} Search</a>
      <p class="hero-desc">Find your semester, subject and previous-year question papers in seconds.</p>
      <p class="spec-strip">8 SEMESTERS · ${totalSubjects()} SUBJECTS · ${totalPaperSlots()} PAPER SLOTS</p>
    </section>`;
}

function renderSemesters(){
  const cards = Object.keys(PYQ_DATA).map(semId => `
    <a href="#/semester/${semId}" class="card sem-card">
      <span class="icon-badge">${icon('chip')}</span>
      <span class="sem-num">${pad2(semId)}</span>
      <span class="sem-label">Semester ${semId}</span>
      <span class="sem-sub">${subjectCount(semId)} subjects</span>
    </a>`).join('');
  return `
    <section class="page-enter">
      <div class="page-header">
        <h2>Select your semester</h2>
        <p class="page-sub">Choose a semester to browse its subjects and papers.</p>
      </div>
      <div class="card-grid sem-grid">${cards}</div>
      <a href="#/" class="back-link">${icon('back')} Back to home</a>
    </section>`;
}

function renderSubjects(semId){
  const sem = PYQ_DATA[semId];
  if(!sem) return renderNotFound();
  const entries = Object.entries(sem.subjects);
  const cards = entries.map(([name,data]) => `
    <a href="#/semester/${semId}/subject/${slugify(name)}" class="card subj-card" data-name="${esc(name.toLowerCase())} ${esc(data.code.toLowerCase())}">
      <span class="icon-badge">${icon(data.icon)}</span>
      <span class="subj-name">${esc(name)}</span>
      <span class="subj-code">${esc(data.code)}</span>
      <span class="view-link">View PYQs <span class="arrow">→</span></span>
    </a>`).join('');
  return `
    <section class="page-enter">
      <div class="page-header">
        <h2>Semester ${semId}</h2>
        <p class="page-sub">${entries.length} subjects · pick one to see previous year papers</p>
      </div>
      <input type="text" class="filter-input" data-filter-subjects placeholder="Filter subjects or codes…" autocomplete="off">
      <div class="card-grid subj-grid">${cards}</div>
      <a href="#/semesters" class="back-link">${icon('back')} Back to semesters</a>
    </section>`;
}

function renderYears(semId, subjectSlug){
  const found = findSubjectBySlug(semId, subjectSlug);
  if(!found) return renderNotFound();
  const { name, data } = found;
  const cards = YEARS.map(y => {
    const has = !!data.papers[y];
    return `
    <a href="#/semester/${semId}/subject/${subjectSlug}/year/${y}" class="card year-card">
      <span class="year-num">${y}</span>
      <span class="year-status ${has?'available':'pending'}"><span class="dot"></span>${has?'Available':'Coming soon'}</span>
    </a>`;
  }).join('');
  return `
    <section class="page-enter">
      <div class="page-header">
        <h2>${esc(name)}</h2>
        <p class="page-sub">${esc(data.code)} · Semester ${semId} · Previous year papers</p>
      </div>
      <div class="card-grid year-grid">${cards}</div>
      <a href="#/semester/${semId}" class="back-link">${icon('back')} Back to Semester ${semId} subjects</a>
    </section>`;
}

function renderPaper(semId, subjectSlug, year){
  const found = findSubjectBySlug(semId, subjectSlug);
  if(!found || !YEARS.includes(Number(year))) return renderNotFound();
  const { name, data } = found;
  const url = data.papers[year];
  return `
    <section class="page-enter paper-page">
      <div class="page-header">
        <h2>${esc(name)} — ${year}</h2>
        <div class="meta-chips">
          <span class="chip-meta">Semester ${semId}</span>
          <span class="chip-meta">${esc(data.code)}</span>
          <span class="chip-meta">${year}</span>
        </div>
      </div>
      <div class="paper-actions">
        ${url
          ? `<a class="btn btn-ghost" href="${esc(url)}" download="${esc(slugify(name))}-${year}.pdf">${icon('download')} Download</a><button class="btn btn-ghost" id="fullscreenBtn">${icon('expand')} Full-screen</button>`
          : `<button class="btn btn-ghost" disabled>${icon('download')} Download</button>`}
      </div>
      <div class="viewer-frame" id="viewerFrame">
        ${url
          ? `<iframe src="${esc(url)}" title="${esc(name)} ${year} question paper"></iframe>`
          : `<div class="empty-state"><span class="icon-badge">${icon('doc')}</span><p>This paper hasn't been uploaded yet.</p><p class="empty-sub">Add a PDF link for ${year} in the data object and it will appear here automatically.</p></div>`}
      </div>
      <a href="#/semester/${semId}/subject/${subjectSlug}" class="back-link">${icon('back')} Back to ${esc(name)}</a>
    </section>`;
}

function renderNotFound(){
  return `
    <section class="page-enter notfound">
      <h2>Page not found</h2>
      <p class="page-sub">That link doesn't match any semester, subject or year.</p>
      <a href="#/" class="btn btn-primary" style="margin-top:20px;">${icon('back')} Back to home</a>
    </section>`;
}

function currentRoute(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const parts = raw.split('/').filter(Boolean);
  if(parts.length === 0) return { view:'home' };
  if(parts[0] === 'semesters') return { view:'semesters' };
  if(parts[0] === 'semester' && parts[1]){
    const semId = parts[1];
    if(parts[2] === 'subject' && parts[3]){
      const subjectSlug = parts[3];
      if(parts[4] === 'year' && parts[5]) return { view:'paper', semId, subjectSlug, year: parts[5] };
      return { view:'years', semId, subjectSlug };
    }
    return { view:'subjects', semId };
  }
  return { view:'notfound' };
}

function routeDepth(route){
  switch(route.view){
    case 'home': return 0;
    case 'semesters': return 1;
    case 'subjects': return 2;
    case 'years': return 3;
    case 'paper': return 4;
    default: return 0;
  }
}
function traceBarHTML(depth){
  const stages = ['Home','Semester','Subject','Year','Paper'];
  let html = '';
  stages.forEach((label,i) => {
    if(i>0) html += `<span class="trace-seg ${depth>=i?'lit':''}"></span>`;
    html += `<span class="trace-dot ${depth>=i?'lit':''} ${depth===i?'current':''}" title="${label}"></span>`;
  });
  return html;
}

function buildCrumbs(route){
  const crumbs = [{ label:'Home', href:'#/' }];
  if(route.view === 'home'){ crumbs[0].current = true; return crumbs; }
  crumbs.push({ label:'Semesters', href:'#/semesters', current: route.view==='semesters' });
  if(route.view === 'semesters') return crumbs;
  crumbs.push({ label:`Semester ${route.semId}`, href:`#/semester/${route.semId}`, current: route.view==='subjects' });
  if(route.view === 'subjects') return crumbs;
  const found = findSubjectBySlug(route.semId, route.subjectSlug);
  crumbs.push({ label: found ? found.name : 'Subject', href:`#/semester/${route.semId}/subject/${route.subjectSlug}`, current: route.view==='years' });
  if(route.view === 'years') return crumbs;
  crumbs.push({ label:String(route.year), current:true });
  return crumbs;
}

function renderCrumbsHTML(crumbs){
  return crumbs.map((c,i) => {
    const sep = i>0 ? '<span class="bc-sep">/</span>' : '';
    if(c.current || !c.href) return `${sep}<span class="bc-current">${esc(c.label)}</span>`;
    return `${sep}<a href="${c.href}">${esc(c.label)}</a>`;
  }).join('');
}

function render(){
  const route = currentRoute();
  const app = document.getElementById('app');
  let html;
  switch(route.view){
    case 'home': html = renderHome(); break;
    case 'semesters': html = renderSemesters(); break;
    case 'subjects': html = renderSubjects(route.semId); break;
    case 'years': html = renderYears(route.semId, route.subjectSlug); break;
    case 'paper': html = renderPaper(route.semId, route.subjectSlug, route.year); break;
    default: html = renderNotFound();
  }
  app.innerHTML = html;
  document.getElementById('breadcrumb').innerHTML = renderCrumbsHTML(buildCrumbs(route));
  document.getElementById('traceBar').innerHTML = traceBarHTML(routeDepth(route));
  window.scrollTo({ top:0, behavior:'auto' });
}

document.addEventListener('click', (e) => {
  const fsBtn = e.target.closest('#fullscreenBtn');
  if(fsBtn){
    const frame = document.getElementById('viewerFrame');
    if(frame){
      if(frame.requestFullscreen) frame.requestFullscreen();
      else if(frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
    }
  }
});

document.addEventListener('input', (e) => {
  if(e.target.matches('[data-filter-subjects]')){
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('.subj-card').forEach(card => {
      const hay = card.dataset.name || '';
      card.style.display = hay.includes(q) ? '' : 'none';
    });
  }
});

document.addEventListener('click', (e) => {
  if(e.target.closest('.btn, .nav-search-btn, .nav-brand, .card, .back-link, .theme-toggle')){
    playClickSound();
  }
});

window.addEventListener('hashchange', render);
document.getElementById('navBrandIcon').innerHTML = icon('chip');
document.getElementById('navSearchBtn').innerHTML = icon('search');

/* Dark / light theme toggle — starts from the visitor's OS-level preference,
   then flips freely between the two on each click of #themeToggle. */
function applyTheme(theme){
  const isLight = theme === 'light';
  if(isLight) document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  const toggle = document.getElementById('themeToggle');
  if(toggle){
    toggle.setAttribute('aria-checked', isLight ? 'true' : 'false');
    toggle.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
  }
  const metaColor = document.querySelector('meta[name="theme-color"]');
  if(metaColor) metaColor.setAttribute('content', isLight ? '#f4f7fb' : '#070a12');
  const metaScheme = document.querySelector('meta[name="color-scheme"]');
  if(metaScheme) metaScheme.setAttribute('content', isLight ? 'light' : 'dark');
}
let currentTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
document.getElementById('themeIconMoon').innerHTML = icon('moon');
document.getElementById('themeIconSun').innerHTML = icon('sun');
document.getElementById('themeToggle').addEventListener('click', () => {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  applyTheme(currentTheme);
});
applyTheme(currentTheme);

render();
</script>
